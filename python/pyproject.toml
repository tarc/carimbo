[project]
name = "carimbo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx2==2.13.1",
  "pydantic==2.13.5",
  "typer==0.27.2",
  "jsonschema==4.26.0",
  "nfelib==3.0.0",
  "brazilfiscalreport==1.2.0",
  "faker==40.40.0",
  "lxml==6.1.3",
]

[dependency-groups]
dev = [
  "ruff==0.16.10",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "datamodel-code-generator==0.83.0",
  "pypdfium2==5.13.0",
  "zxing-cpp==3.1.1",
]

[project.scripts]
carimbo-datagen = "carimbo_datagen.cli:app"
carimbo-evals = "carimbo_evals.cli:app"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carimbo_models", "src/carimbo_datagen", "src/carimbo_evals"]

[tool.uv]
required-version = ">=0.8.17"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
exclude = ["src/carimbo_models/generated.py"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib", "-m", "not e2e and not live"]
xfail_strict = true
markers = [
  "e2e: needs the .NET 10 SDK; drives the real ASP.NET host",
  "live: calls the paid Anthropic API",
]
