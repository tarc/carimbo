[project]
name = "carimbo"
revision = "1.0"

[profiles.default]
# Optional: without it, live model calls are skipped and everything else runs
# against a fake model client (D-10).
CARIMBO_ANTHROPIC_API_KEY = { description = "Anthropic API key for live model calls (dedicated, low spend limit)", required = false }

# Inherits everything from default. Declared because `secretspec config global
# init` selects this profile, and run fails on an undeclared profile.
[profiles.development]
